# core.hooksPath is global, so syncing here would replace the hook shared by every repository.
no_auto_install: true

pre-commit:
  commands:
    gofmt:
      run: test -z "$(gofmt -l .)"
    vet:
      run: go vet ./...
    test:
      run: go test ./...
    checkov:
      run: |
        untracked=$(git ls-files --others --ignored --exclude-standard --directory | grep '/$' | sed 's|/$||;s|\.|\\.|g' | paste -sd'|')
        checkov -d . --quiet --compact --external-checks-dir terraform/checkov --skip-path "($untracked)"
