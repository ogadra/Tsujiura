    :root {
      --bg: #fffaed;
      --surface: #ffffff;
      --ink: #222222;
      --heading: #004aba;
      --muted: #616161;
      --link: #004aba;
      --accent: #ea5520;
      --rule: #a7a7a7;
      --table-rule: #dcdcdc;
      --route53: #ea5520;
      --route53-text: #ffffff;
      --route53-tint: #fcebe4;
      --cloud-dns: #004aba;
      --cloud-dns-text: #ffffff;
      --cloud-dns-tint: #e0e9f7;
      --label: #222222;
      --shadow: rgba(34, 34, 34, 0.06);
      --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Meiryo", sans-serif;
      --font-display: "Solway", "Rockwell", "Roboto Slab", Georgia, "Times New Roman", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b2440;
        --surface: #10355e;
        --ink: #fffaed;
        --heading: #fffaed;
        --muted: #c9cfd8;
        --link: #8db8ff;
        --rule: rgba(255, 250, 237, 0.35);
        --table-rule: rgba(255, 250, 237, 0.15);
        --route53-tint: #313a55;
        --cloud-dns: #8db8ff;
        --cloud-dns-text: #222222;
        --cloud-dns-tint: #234976;
        --label: #fffaed;
        --shadow: rgba(0, 0, 0, 0.25);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-feature-settings: "palt";
      line-height: 1.75;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      width: min(100%, 64rem);
      margin: 0 auto;
      padding: clamp(2.5rem, 8vw, 5rem) clamp(1rem, 5vw, 2.5rem) 2.5rem;
    }

    h1 {
      margin: 0 0 clamp(1.75rem, 5vw, 2.5rem);
      color: var(--heading);
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 12vw, 4.5rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    h1::after {
      content: "";
      display: block;
      width: 4.5rem;
      height: 0.5rem;
      margin-top: 0.75rem;
      border-radius: 999px;
      background: var(--accent);
    }

    .card {
      --stitch-inset: 0.5rem;
      position: relative;
      padding: clamp(1.5rem, 5vw, 2.25rem) clamp(1rem, 5vw, 2.75rem);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 10px 0 var(--shadow);
    }

    @media (min-width: 40rem) {
      .card {
        --stitch-inset: 0.75rem;
      }
    }

    .card::before {
      border-radius: inherit;
      content: "";
      inset: var(--stitch-inset);
      pointer-events: none;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      position: absolute;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0.5' y='0.5' width='99' height='99' rx='4' ry='4' fill='none' stroke='%23a7a7a7' stroke-width='2' stroke-linecap='round' stroke-dasharray='6 12' vector-effect='non-scaling-stroke'/%3E%3C/svg%3E");
    }

    .card h2 {
      display: inline-block;
      margin: 0 0 1.25rem;
      padding: 0.25rem 0.75rem;
      border: 2px solid var(--label);
      border-radius: 999px;
      font-size: clamp(0.875rem, 3vw, 1rem);
      font-weight: 500;
      line-height: 1.5;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    #result {
      font-size: clamp(0.875rem, 3.4vw, 1.0625rem);
      font-weight: 500;
      overflow-wrap: break-word;
    }

    #result > * + * {
      margin-top: 1.5rem;
    }

    #result p {
      margin: 0;
    }

    table {
      --column-gap: clamp(0.25rem, 1vw, 0.5rem);
      width: calc(100% + 2 * var(--column-gap));
      margin-inline: calc(-1 * var(--column-gap));
      border-collapse: separate;
      border-spacing: var(--column-gap) 0;
    }

    th,
    td {
      padding: 0.75rem clamp(0.25rem, 1.5vw, 0.5rem);
      border-top: 1px dashed var(--table-rule);
      text-align: center;
      vertical-align: baseline;
    }

    thead th {
      vertical-align: middle;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    thead th.provider {
      border-top: 0;
      border-radius: 0.5rem 0.5rem 0 0;
      background: var(--provider);
      color: var(--provider-text);
      font-size: 1.1875rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    td.count {
      border-top-color: transparent;
      background: var(--provider-tint);
    }

    tbody tr:last-child td.count {
      border-radius: 0 0 0.5rem 0.5rem;
    }

    .route53 {
      --provider: var(--route53);
      --provider-text: var(--route53-text);
      --provider-tint: var(--route53-tint);
    }

    .cloud-dns {
      --provider: var(--cloud-dns);
      --provider-text: var(--cloud-dns-text);
      --provider-tint: var(--cloud-dns-tint);
    }

    .pending {
      --provider: var(--muted);
      --provider-text: var(--surface);
      --provider-tint: var(--bg);
    }

    th.pending {
      font-family: var(--font-body);
    }

    tbody th {
      font-weight: 700;
    }

    th:first-child {
      text-align: left;
    }

    tr.breakdown > * {
      color: var(--muted);
    }

    tr.breakdown > th {
      padding-left: 1rem;
      font-size: 0.875em;
      font-weight: 500;
    }

    tr.breakdown > th::before {
      content: "└ ";
    }

    td.count {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .message {
      font-weight: 700;
    }

    #result > .message + .detail {
      margin-top: 0.25rem;
    }

    .detail {
      color: var(--muted);
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    footer {
      width: min(100%, 64rem);
      margin: 0 auto;
      padding: 1.5rem clamp(1rem, 5vw, 2.5rem) 2rem;
      color: var(--muted);
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    footer p {
      margin: 0;
    }

    @media (max-width: 30rem) {
      main,
      footer {
        padding-inline: 0.5rem;
      }

      .card {
        padding-inline: 1rem;
      }

      th,
      td {
        padding-inline: 0.125rem;
      }

      thead th.provider {
        font-size: 0.875rem;
        white-space: nowrap;
      }
    }

    .served-by {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0 0 1rem auto;
      padding: 0.3em 0.93em 0.5em;
      background: var(--served-by);
      color: var(--served-by-text);
      font-size: clamp(0.8125rem, 3.9vw, 1.5rem);
      font-weight: 700;
      line-height: 1.4;
      white-space: nowrap;
      transform: rotate(-0.5deg);
      -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 64' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 4.5C72 1 150 6.5 230 3C300 0.5 350 4.5 393 1.5Q399 1 398.8 7C397 22 400.5 40 398.5 57Q398 63 392 62.8C326 60 258 64 180 61C110 58.5 50 63.5 6.5 60.8Q0.5 60.5 1 54.5C3 40 -0.5 24 2 11Q2.5 5 8 4.5Z'/%3E%3C/svg%3E") 50% / 100% 100% no-repeat;
      mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 64' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 4.5C72 1 150 6.5 230 3C300 0.5 350 4.5 393 1.5Q399 1 398.8 7C397 22 400.5 40 398.5 57Q398 63 392 62.8C326 60 258 64 180 61C110 58.5 50 63.5 6.5 60.8Q0.5 60.5 1 54.5C3 40 -0.5 24 2 11Q2.5 5 8 4.5Z'/%3E%3C/svg%3E") 50% / 100% 100% no-repeat;
    }

    .served-by::before {
      content: "";
      position: absolute;
      inset: 0.25em;
      pointer-events: none;
      background: currentColor;
      -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 50' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 4.8C80 2 150 6 235 3.5C300 2 350 5 392 2.8Q397 2.5 396.8 7.5C395.5 19 398 32 396.3 42Q396 47 391 46.8C325 45 255 48 180 45.5C110 43.5 55 47.5 9 45.2Q4 45 4.2 40C5.5 30 2.5 18 3 9.8Q3.2 5 8 4.8Z' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-dasharray='7 7' vector-effect='non-scaling-stroke'/%3E%3C/svg%3E") 50% / 100% 100% no-repeat;
      mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 50' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 4.8C80 2 150 6 235 3.5C300 2 350 5 392 2.8Q397 2.5 396.8 7.5C395.5 19 398 32 396.3 42Q396 47 391 46.8C325 45 255 48 180 45.5C110 43.5 55 47.5 9 45.2Q4 45 4.2 40C5.5 30 2.5 18 3 9.8Q3.2 5 8 4.8Z' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-dasharray='7 7' vector-effect='non-scaling-stroke'/%3E%3C/svg%3E") 50% / 100% 100% no-repeat;
    }

    .served-by strong {
      margin-left: 0.25rem;
      font-family: var(--font-display);
      font-weight: 800;
    }

    .served-by.aws {
      --served-by: var(--route53);
      --served-by-text: #ffffff;
    }

    .served-by.google-cloud {
      --served-by: #004aba;
      --served-by-text: #ffffff;
    }

    a {
      color: var(--link);
      text-underline-offset: 0.2em;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 0.25rem;
    }

    #remeasure {
      display: block;
      margin: 1.5rem auto 0;
      padding: 0.5rem 1.75rem;
      border: 2px solid var(--label);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: clamp(0.875rem, 3.4vw, 1.0625rem);
      font-weight: 700;
      line-height: 1.5;
      cursor: pointer;
    }

    #remeasure:hover {
      background: var(--bg);
    }

    #remeasure:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #remeasure[aria-disabled="true"] {
      background: transparent;
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
  <script type="module">
    const DOMAIN = location.hostname;
    const TOKEN_COUNT = 10;
    const POLL_INTERVAL_MS = 2000;
    const POLL_START_DELAY_MS = 3000;
    const POLL_TIMEOUT_MS = 120000;
    const MEASURE_FAILED = "結果を取得できませんでした";

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function probeToken(token, deadline) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve();
        image.onerror = () => resolve();
        setTimeout(() => resolve(), deadline - Date.now());
        image.src = `https://${token}.${DOMAIN}/provider.svg`;
      });
    }

    async function fetchResults(tokens) {
      const response = await fetch(`/api/result?tokens=${tokens.join(",")}`);
      try {
        return { status: response.status, body: await response.json() };
      } catch (error) {
        throw new Error(`HTTP ${response.status}: ${error.message}`);
      }
    }

    function pollTokens(tokens, deadline) {
      const settled = new Map(tokens.map((token) => [token, Promise.withResolvers()]));
      (async () => {
        await sleep(POLL_START_DELAY_MS);
        let pending = tokens;
        for (;;) {
          const result = await fetchResults(pending);
          const last = result.status !== 200 || Date.now() + POLL_INTERVAL_MS >= deadline;
          pending = pending.filter((token) => {
            const body = result.status === 200 ? result.body[token] : result.body;
            if (last || body.route53 || body.cloudDns) {
              settled.get(token).resolve({ token, status: result.status, body });
              return false;
            }
            return true;
          });
          if (pending.length === 0) {
            return;
          }
          await sleep(POLL_INTERVAL_MS);
        }
      })().catch((error) => {
        for (const { reject } of settled.values()) {
          reject(error);
        }
      });
      return tokens.map((token) => settled.get(token).promise);
    }

    async function measure(onResult) {
      const tokens = Array.from({ length: TOKEN_COUNT }, () => crypto.randomUUID());
      const deadline = Date.now() + POLL_TIMEOUT_MS;
      const polls = pollTokens(tokens, deadline);
      await Promise.all(
        tokens.map((token, i) => Promise.all([probeToken(token, deadline), polls[i].then((result) => onResult(i, result))])),
      );
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      node.textContent = text;
      if (className) {
        node.className = className;
      }
      return node;
    }

    function table(head, rows) {
      const node = document.createElement("table");
      const headRow = node.createTHead().insertRow();
      for (const label of head) {
        const cell = element("th", label.text ?? label, label.className);
        cell.scope = "col";
        headRow.append(cell);
      }
      const body = node.createTBody();
      for (const [label, ...values] of rows) {
        const row = body.insertRow();
        if (label.className) {
          row.className = label.className;
        }
        const cell = element("th", label.text ?? label);
        cell.scope = "row";
        row.append(cell, ...values.map((value) => element("td", value.text, value.className)));
      }
      return node;
    }

    const ROUTE53_HEAD = { text: "Route53", className: "provider route53" };
    const CLOUD_DNS_HEAD = { text: "Cloud DNS", className: "provider cloud-dns" };
    const PENDING_HEAD = { text: "確認中", className: "provider pending" };
    const MISSING_HEAD = { text: "未到達", className: "provider pending" };

    const count = (n, unit, provider) => ({ text: `${n}${unit}`, className: `count ${provider}` });

    function queriesRow(results, done) {
      const settled = results.filter(Boolean);
      const reached = (provider) => settled.filter((result) => result.body[provider]).length;
      const rest = done ? settled.filter((result) => !result.body.route53 && !result.body.cloudDns).length : results.length - settled.length;
      return ["クエリを受信した権威 DNS", count(reached("route53"), "件", "route53"), count(reached("cloudDns"), "件", "cloud-dns"), count(rest, "件", "pending")];
    }

    function providersTable(rows, done) {
      return table(["", ROUTE53_HEAD, CLOUD_DNS_HEAD, done ? MISSING_HEAD : PENDING_HEAD], rows);
    }

    function resolverRows(results) {
      const resolvers = new Map();
      for (const result of results) {
        for (const provider of ["route53", "cloudDns"]) {
          const record = result.body[provider];
          if (!record) {
            continue;
          }
          const key = record.asn ? `AS${record.asn} ${record.asOrganization ?? ""}`.trim() : "ASN不明";
          const resolver = resolvers.get(key) ?? { route53: 0, cloudDns: 0 };
          resolver[provider] += 1;
          resolvers.set(key, resolver);
        }
      }
      return [...resolvers].map(([key, resolver]) => [{ text: key, className: "breakdown" }, count(resolver.route53, "件", "route53"), count(resolver.cloudDns, "件", "cloud-dns"), { text: "", className: "count pending" }]);
    }

    function summarize(results, done) {
      const settled = results.filter(Boolean);
      const failed = settled.filter((result) => result.status !== 200);
      if (failed.length > 0) {
        const databases = new Set(failed.flatMap((result) => result.body.unavailable ?? []));
        if (databases.size > 0) {
          return [element("p", `${[...databases].join("、")}を読めなかったため、計測を止めました`, "message")];
        }
        const statuses = [...new Set(failed.map((result) => `HTTP ${result.status}`))].join("、");
        return [element("p", MEASURE_FAILED, "message"), element("p", statuses, "detail")];
      }
      const breakdown = resolverRows(settled);
      const summary = providersTable([queriesRow(results, done), ...breakdown], done);
      return breakdown.length > 0 || !done ? [summary] : [summary, element("p", "クエリ送信元リゾルバ: なし", "message")];
    }

    function show(nodes) {
      document.getElementById("result").replaceChildren(...nodes);
    }

    function announce() {
      const result = document.getElementById("result");
      const table = result.querySelector("table");
      const texts = [...result.children].filter((node) => node !== table).map((node) => node.textContent);
      if (table) {
        const heads = [...table.tHead.rows[0].cells].slice(1).map((cell) => cell.textContent);
        const [label, ...values] = [...table.tBodies[0].rows[0].cells].map((cell) => cell.textContent);
        texts.unshift(`${label}: ${heads.map((head, i) => `${head} ${values[i]}`).join("、")}`);
      }
      document.getElementById("announcement").textContent = texts.join(" ");
    }

    const remeasure = document.getElementById("remeasure");

    async function run() {
      remeasure.setAttribute("aria-disabled", "true");
      document.getElementById("announcement").textContent = "";
      const results = Array(TOKEN_COUNT).fill(null);
      show(summarize(results, false));
      try {
        await measure((i, result) => {
          results[i] = result;
          show(summarize(results, false));
        });
        show(summarize(results, true));
      } catch (error) {
        show([element("p", MEASURE_FAILED, "message"), element("p", error.message, "detail")]);
      }
      announce();
      remeasure.setAttribute("aria-disabled", "false");
    }

    remeasure.addEventListener("click", () => {
      if (remeasure.getAttribute("aria-disabled") === "false") {
        run();
      }
    });
    await run();
  </script>
</head>
<body>
  <main>
    <h1>Tsujiura</h1>
    <section class="card" aria-labelledby="result-heading">
      <h2 id="result-heading">計測結果</h2>
      <div id="result"></div>
      <button id="remeasure" type="button" aria-disabled="true">再測定</button>
      <p id="announcement" class="visually-hidden" aria-live="polite"></p>
    </section>
  </main>
  <footer>
    <p class="served-by {{.Provider}}">このページを返したクラウド <strong>{{.Name}}</strong></p>

  </footer>
</body>
